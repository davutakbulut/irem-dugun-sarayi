      if (amount === undefined || amount === null) return '₺0';
      return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(amount);
    }
    function formatDate(dateString) {
      if (!dateString) return '';
      return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(dateString));
    }
    function checkBookingCollision(reservations, venueId, date, timeSlot, excludeId = null) {
      return reservations.find(r => r.id !== excludeId && r.venueId === venueId && r.date === date && r.timeSlot === timeSlot);
    }

        return { totalRev, totalDeposit, totalPending };

          return matchSearch && matchStatus;
        });

        if (venueData.id) {
          setVenues(prev => prev.map(v => v.id === venueData.id ? venueData : v));

          showToast('🎉 Yeni Düğün Salonu Eklendi!');
        }

        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-heading font-extrabold gold-gradient-text">Kullanıcı Yönetimi</h2>
            <button onClick={onAddClick} className="gold-button text-gray-950 font-bold px-4 py-2 rounded-xl text-xs">⚙️ Yeni Kullanıcı Ekle</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {users.map(u => (
              <div key={u.id} className="glass-panel p-5 rounded-2xl text-center space-y-3">
                <img src={u.avatar} className="w-16 h-16 rounded-full mx-auto object-cover border-2 border-gold-500/50" />
                <div>
                  <h3 className="font-bold text-sm text-gray-100">{u.name}</h3>
                  <div className="text-xs text-gray-400 truncate">{u.email}</div>
                </div>
                <div className="flex justify-between items-center pt-2 border-t border-brand-border">
                  <span className="bg-gold-500/20 text-gold-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">{u.role}</span>
                  <button onClick={() => onEditClick(u)} className="text-xs text-gold-400 hover:underline">Düzenle ✏️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- REPORTS COMPONENT ---
    function ReportsComponent({ reservations, aiRecommendations, onCampaignClick, onServiceClick }) {
      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-heading font-extrabold gold-gradient-text">Yapay Zeka Önerileri & Raporlar</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {aiRecommendations.map(rec => (
              <div key={rec.id} className="glass-panel p-6 rounded-3xl space-y-3 border border-gold-500/40">
                <span className="bg-gold-500/20 text-gold-400 text-xs font-bold px-3 py-1 rounded-full">✨ AI Öneri</span>
                <h3 className="font-bold text-lg text-gray-100">{rec.title}</h3>
                <p className="text-xs text-gray-300">{rec.description}</p>
                <button onClick={rec.id === 'r1' ? onCampaignClick : onServiceClick} className="gold-button text-gray-950 font-bold px-4 py-2 rounded-xl text-xs">
                  {rec.actionText}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- MEDIA COMPONENT ---
    function MediaComponent({ reservations, showToast }) {
      return (
        <div className="space-y-6 max-w-xl mx-auto text-center">
          <h2 className="text-2xl font-heading font-extrabold gold-gradient-text">Medya & Foto Yükleme</h2>
          <div className="glass-panel p-8 rounded-3xl space-y-4">
            <div className="text-4xl">📤</div>
            <p className="text-xs text-gray-300">Rezervasyon fotoğraf ve video galerisini güncellemek için dosya yükleyin.</p>
            <button onClick={() => showToast('📸 Örnek Medya Galerisi Güncellendi!')} className="gold-button text-gray-950 font-bold px-6 py-2.5 rounded-xl text-xs">
              Fotoğraf Yükle
            </button>
          </div>
        </div>
      );
    }

    // --- VENUE FORM MODAL ---
    function VenueFormModal({ venue, onClose, onSave, onDelete }) {
      const [name, setName] = useState(venue?.name || '');
      const [category, setCategory] = useState(venue?.category || 'Kapalı Salon');
      const [capacity, setCapacity] = useState(venue?.capacity || 500);
      const [price, setPrice] = useState(venue?.price || 50000);
      const [deposit, setDeposit] = useState(venue?.deposit || 10000);
      const [description, setDescription] = useState(venue?.description || '');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="text-lg font-bold text-gray-100">{venue ? 'Salon Düzenle' : 'Yeni Salon Ekle'}</h3>
            <div className="space-y-3 text-xs">
              <input type="text" placeholder="Salon Adı" value={name} onChange={e => setName(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200">
                <option value="Kapalı Salon">Kapalı Salon</option>
                <option value="Açık Hava / Kır Bahçesi">Açık Hava / Kır Bahçesi</option>
                <option value="Butik / Teras">Butik / Teras</option>
              </select>
              <div className="grid grid-cols-2 gap-2">
                <input type="number" placeholder="Kapasite" value={capacity} onChange={e => setCapacity(Number(e.target.value))} className="bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
                <input type="number" placeholder="Taban Fiyat (TL)" value={price} onChange={e => setPrice(Number(e.target.value))} className="bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              </div>
              <textarea placeholder="Açıklama" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200 h-20" />
            </div>
            <div className="flex justify-between pt-2">
              {venue && <button onClick={() => onDelete(venue.id)} className="px-4 py-2 bg-red-950 text-red-300 rounded-xl text-xs font-bold">Sil 🗑️</button>}
              <div className="flex space-x-2 ml-auto">
                <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">İptal</button>
                <button onClick={() => onSave({ ...venue, name, category, capacity, price, deposit, description })} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Kaydet</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- SERVICE FORM MODAL ---
    function ServiceFormModal({ service, onClose, onSave, onDelete }) {
      const [name, setName] = useState(service?.name || '');
      const [category, setCategory] = useState(service?.category || 'Catering');
      const [price, setPrice] = useState(service?.price || 5000);
      const [pricingType, setPricingType] = useState(service?.pricingType || 'fixed');
      const [description, setDescription] = useState(service?.description || '');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="text-lg font-bold text-gray-100">{service ? 'Hizmet Düzenle' : 'Yeni Hizmet Ekle'}</h3>
            <div className="space-y-3 text-xs">
              <input type="text" placeholder="Hizmet Adı" value={name} onChange={e => setName(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <select value={pricingType} onChange={e => setPricingType(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200">
                <option value="fixed">Sabit Fiyat</option>
                <option value="per_person">Kişi Başı Fiyat</option>
              </select>
              <input type="number" placeholder="Fiyat (TL)" value={price} onChange={e => setPrice(Number(e.target.value))} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <textarea placeholder="Açıklama" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200 h-20" />
            </div>
            <div className="flex justify-between pt-2">
              {service && <button onClick={() => onDelete(service.id)} className="px-4 py-2 bg-red-950 text-red-300 rounded-xl text-xs font-bold">Sil 🗑️</button>}
              <div className="flex space-x-2 ml-auto">
                <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">İptal</button>
                <button onClick={() => onSave({ ...service, name, category, price, pricingType, description })} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Kaydet</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- CAMPAIGN FORM MODAL ---
    function CampaignFormModal({ campaign, services, onClose, onSave }) {
      const [title, setTitle] = useState(campaign?.title || '');
      const [code, setCode] = useState(campaign?.code || '');
      const [description, setDescription] = useState(campaign?.description || '');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="text-lg font-bold text-gray-100">{campaign ? 'Kampanya Düzenle' : 'Yeni Kampanya'}</h3>
            <div className="space-y-3 text-xs">
              <input type="text" placeholder="Kampanya Başlığı" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <input type="text" placeholder="Kupon Kodu (Örn: IREM2026)" value={code} onChange={e => setCode(e.target.value.toUpperCase())} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200 font-mono" />
              <textarea placeholder="Açıklama" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200 h-20" />
            </div>
            <div className="flex justify-end space-x-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">İptal</button>
              <button onClick={() => onSave({ ...campaign, title, code, description, type: 'percentage', value: 10, startDate: '2026-01-01', endDate: '2026-12-31' })} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Kaydet</button>
            </div>
          </div>
        </div>
      );
    }

    // --- CUSTOMER FORM MODAL ---
    function CustomerFormModal({ customer, onClose, onSave }) {
      const [name, setName] = useState(customer?.name || '');
      const [phone, setPhone] = useState(customer?.phone || '');
      const [email, setEmail] = useState(customer?.email || '');
      const [address, setAddress] = useState(customer?.address || '');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="text-lg font-bold text-gray-100">{customer ? 'Müşteri Düzenle' : 'Yeni Müşteri'}</h3>
            <div className="space-y-3 text-xs">
              <input type="text" placeholder="Ad Soyad / Firma" value={name} onChange={e => setName(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <input type="tel" placeholder="Telefon" value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <input type="email" placeholder="E-Posta" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <input type="text" placeholder="Adres" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
            </div>
            <div className="flex justify-end space-x-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">İptal</button>
              <button onClick={() => onSave({ ...customer, name, phone, email, address, taxType: 'individual' })} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Kaydet</button>
            </div>
          </div>
        </div>
      );
    }

    // --- USER FORM MODAL ---
    function UserFormModal({ user, onClose, onSave }) {
      const [name, setName] = useState(user?.name || '');
      const [email, setEmail] = useState(user?.email || '');
      const [role, setRole] = useState(user?.role || 'satisci');

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-md w-full p-6 space-y-4">
            <h3 className="text-lg font-bold text-gray-100">{user ? 'Kullanıcı Düzenle' : 'Yeni Kullanıcı'}</h3>
            <div className="space-y-3 text-xs">
              <input type="text" placeholder="Ad Soyad" value={name} onChange={e => setName(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <input type="email" placeholder="E-Posta" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200" />
              <select value={role} onChange={e => setRole(e.target.value)} className="w-full bg-brand-dark border border-brand-border rounded-xl p-2 text-gray-200">
                <option value="admin">Admin (Tam Yetkili)</option>
                <option value="satisci">Satışçı</option>
                <option value="sosyal_medyaci">Sosyal Medyacı</option>
                <option value="musteri">Müşteri</option>
              </select>
            </div>
            <div className="flex justify-end space-x-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">İptal</button>
              <button onClick={() => onSave({ ...user, name, email, role })} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Kaydet</button>
            </div>
          </div>
        </div>
      );
    }

    // --- RESERVATION DETAIL & PAYMENT UPDATE MODAL ---
    function ReservationDetailModal({ res, venues, onClose, onUpdatePayment }) {
      const venue = venues.find(v => v.id === res.venueId);
      const [deposit, setDeposit] = useState(res.depositPaid);
      const [status, setStatus] = useState(res.paymentStatus);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-brand-card border border-gold-500/40 rounded-3xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-brand-border pb-3">
              <div>
                <span className="font-mono text-gold-400 font-bold text-xs">{res.id}</span>
                <h3 className="text-lg font-bold text-gray-100">{res.customerName}</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-3 text-xs">
              <div className="bg-brand-dark p-3 rounded-xl border border-brand-border"><div>Salon</div><div className="font-bold text-gray-200">{venue?.name || '-'}</div></div>
              <div className="bg-brand-dark p-3 rounded-xl border border-brand-border"><div>Tarih</div><div className="font-bold text-gray-200">{formatDate(res.date)} ({res.timeSlot})</div></div>
              <div className="bg-brand-dark p-3 rounded-xl border border-brand-border"><div>Toplam Tutar</div><div className="font-bold text-gold-400">{formatCurrency(res.totalAmount)}</div></div>
              <div className="bg-brand-dark p-3 rounded-xl border border-brand-border"><div>Kalan Bakiye</div><div className="font-bold text-red-400">{formatCurrency(Math.max(0, res.totalAmount - deposit))}</div></div>
            </div>

            {/* Editable Payment Status */}
            <div className="bg-brand-dark/70 p-4 rounded-xl border border-gold-500/30 space-y-3">
              <h4 className="font-bold text-xs text-gold-400">💳 Ödeme ve Kapora Güncelleme</h4>
              <div className="grid grid-cols-2 gap-3 text-xs">
                <div>
                  <label className="text-gray-400 block mb-1">Tahsil Edilen Kapora (TL):</label>
                  <input type="number" value={deposit} onChange={e => setDeposit(Number(e.target.value))} className="w-full bg-brand-card border border-brand-border rounded-lg p-2 text-gray-200" />
                </div>
                <div>
                  <label className="text-gray-400 block mb-1">Ödeme Statüsü:</label>
                  <select value={status} onChange={e => setStatus(e.target.value)} className="w-full bg-brand-card border border-brand-border rounded-lg p-2 text-gray-200">
                    <option value="Bekliyor">Bekliyor</option>
                    <option value="Kapora Alındı">Kapora Alındı</option>
                    <option value="Ödendi">Ödendi</option>
                    <option value="Tamamlandı">Tamamlandı</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-2 border-t border-brand-border">
              <button onClick={onClose} className="px-4 py-2 bg-brand-dark text-gray-400 rounded-xl text-xs font-bold">Kapat</button>
              <button onClick={() => onUpdatePayment(res.id, deposit, status)} className="gold-button text-gray-950 font-bold px-5 py-2 rounded-xl text-xs">Ödemeyi Güncelle</button>
            </div>
          </div>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
