                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
              </svg>
            </button>
          </div>

          {/* ========================================================================= */}
          {/* 5. MODAL: FİYAT TEKLİFİ AL (GET A QUOTE MODAL)                            */}
          {/* ========================================================================= */}
          {isQuoteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setIsQuoteModalOpen(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1"
                >
                  <Icon name="close" className="w-5 h-5" />
                </button>

                {quoteSubmitted ? (
                  <div className="text-center py-10 space-y-4">
                    <div className="w-16 h-16 rounded-full bg-green-100 text-green-600 flex items-center justify-center mx-auto text-2xl font-bold">
                      ✓
                    </div>
                    <h3 className="text-2xl font-extrabold text-slate-900">Teklif Talebiniz Alındı!</h3>
                    <p className="text-slate-600 text-sm max-w-md mx-auto">
                      Uzman düğün danışmanımız en geç 15 dakika içinde sizinle iletişime geçerek detaylı fiyat teklifini sunacaktır.
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleQuoteSubmit} className="space-y-4">
                    <div className="text-center space-y-1">
                      <div className="font-script text-3xl text-amber-600">Özel Teklif & Randevu</div>
                      <h3 className="text-xl font-extrabold text-slate-900">Ücretsiz Düğün Fiyat Teklifi Alın</h3>
                      <p className="text-xs text-slate-500">Tesislerimiz için en uygun paket ve indirimli fiyatları hemen öğrenin.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Ad Soyad *</label>
                        <input
                          type="text"
                          required
                          value={quoteForm.name}
                          onChange={(e) => setQuoteForm({ ...quoteForm, name: e.target.value })}
                          placeholder="Örn: Selin & Ahmet"
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Telefon Numarası *</label>
                        <input
                          type="tel"
                          required
                          value={quoteForm.phone}
                          onChange={(e) => setQuoteForm({ ...quoteForm, phone: e.target.value })}
                          placeholder="0 (5XX) XXX XX XX"
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Etkinlik Türü</label>
                        <select
                          value={quoteForm.eventType}
                          onChange={(e) => setQuoteForm({ ...quoteForm, eventType: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 outline-none"
                        >
                          <option value="Düğün">Düğün Organizasyonu</option>
                          <option value="Kına Gecesi">Kına Gecesi & Bekarlığa Veda</option>
                          <option value="Nişan & Söz">Nişan & Söz Töreni</option>
                          <option value="Sünnet">Sünnet Şöleni</option>
                          <option value="Mezuniyet">Mezuniyet & Balo</option>
                          <option value="Kurumsal">Kurumsal Etkinlik</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Tercih Edilen Salon</label>
                        <select
                          value={quoteForm.venue}
                          onChange={(e) => setQuoteForm({ ...quoteForm, venue: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 outline-none"
                        >
                          <option value="Kraliyet Balo Salonu">Kraliyet Balo Salonu (750 Kişi)</option>
                          <option value="Göl Kır Bahçesi">Göl Kır Bahçesi (1.000 Kişi)</option>
                          <option value="Safir VIP Salon">Safir VIP Salon (450 Kişi)</option>
                          <option value="Göl Terası Butik">Göl Terası Butik (250 Kişi)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Tahmini Davetli Sayısı</label>
                        <input
                          type="number"
                          value={quoteForm.guestCount}
                          onChange={(e) => setQuoteForm({ ...quoteForm, guestCount: e.target.value })}
                          placeholder="Örn: 500"
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Planlanan Tarih</label>
                        <input
                          type="date"
                          value={quoteForm.date}
                          onChange={(e) => setQuoteForm({ ...quoteForm, date: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Özel İstek / Notlar</label>
                      <textarea
                        rows="2"
                        value={quoteForm.notes}
                        onChange={(e) => setQuoteForm({ ...quoteForm, notes: e.target.value })}
                        placeholder="Özel menü, orkestra, fotoğraf vb. talepleriniz..."
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500 outline-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={quoteLoading}
                      className="w-full py-3.5 rounded-xl gold-btn font-bold text-sm shadow-xl flex items-center justify-center space-x-2"
                    >
                      {quoteLoading ? <span>Gönderiliyor...</span> : <span>Teklifi Gönder & Fiyat Al ✓</span>}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* 6. MODAL: DİKEY VİDEO OYNATICI (REEL PLAYER)                               */}
          {/* ========================================================================= */}
          {activeVideoModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="relative max-w-sm w-full bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col items-center">
                <button
                  onClick={() => setActiveVideoModal(null)}
                  className="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-black"
                >
                  <Icon name="close" className="w-5 h-5" />
                </button>

                <video 
                  src={activeVideoModal.videoUrl} 
                  autoPlay 
                  loop 
                  controls 
                  className="w-full h-[520px] object-cover"
                ></video>

                <div className="p-4 bg-slate-950 text-white text-center w-full">
                  <div className="font-extrabold text-base">{activeVideoModal.names}</div>
                  <p className="text-xs text-slate-400 mt-1 italic leading-tight">
                    {activeVideoModal.quote}
                  </p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<PublicApp />, document.getElementById('root'));
  </script>
</body>
</html>
