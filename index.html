    const { useState, useEffect, useRef } = React;

    const formatCurrency = (val) => {
      if (val === undefined || val === null || isNaN(val)) return '₺0';
      return '₺' + Number(val).toLocaleString('tr-TR');
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const year = parts[0];
          const monthIdx = parseInt(parts[1], 10) - 1;
          const day = parseInt(parts[2], 10);
          const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
          return `${day} ${months[monthIdx]} ${year}`;
        }
      } catch (e) {}
      return dateStr;
    };

    const formatPhoneNumber = (val) => {
      if (!val) return '';
      const digits = val.replace(/\D/g, '');
      if (digits.length === 0) return '';
      let formatted = '0 ';
      let d = digits.startsWith('0') ? digits.slice(1) : digits;
      if (d.length > 0) formatted += '(' + d.slice(0, 3);
      if (d.length >= 3) formatted += ') ' + d.slice(3, 6);
      if (d.length >= 6) formatted += ' ' + d.slice(6, 8);
      if (d.length >= 8) formatted += ' ' + d.slice(8, 10);
      return formatted;
    };

    const isValidPhoneNumber = (phoneStr) => {
      if (!phoneStr) return false;
      const digits = phoneStr.replace(/\D/g, '');
      return digits.length === 11 && digits.startsWith('05');
    };

    const calculateReservationTotals = ({
      venuePrice = 0, guestCount = 0, selectedServices = [], allServices = [], campaignCode = '', campaigns = [], isInvoiced = false, hasDeposit = false, depositPaid = 0, paymentStatus = 'Bekliyor'
    }) => {
      const vPrice = Number(venuePrice) || 0;
      let servicesTotal = 0;
      const serviceBreakdown = [];

      (selectedServices || []).forEach(item => {
        const sObj = allServices.find(x => x.id === item.serviceId);
        if (sObj) {
          const uPrice = item.customUnitPrice !== undefined ? Number(item.customUnitPrice) : Number(sObj.price);
          const qty = item.quantity !== undefined ? Number(item.quantity) : (sObj.pricingType === 'per_person' ? Number(guestCount) : 1);
          const lineTotal = uPrice * qty;
          servicesTotal += lineTotal;
          serviceBreakdown.push({ id: sObj.id, name: sObj.name, unitPrice: uPrice, quantity: qty, pricingType: sObj.pricingType, total: lineTotal, isPaid: item.isPaid || false });
        }
      });

      const subtotal = vPrice + servicesTotal;
      let discount = 0;
      if (campaignCode) {
        const cmp = campaigns.find(c => c.code === campaignCode && c.active);
        if (cmp) {
          if (cmp.discountType === 'fixed') discount = Number(cmp.discountValue);
          else if (cmp.discountType === 'percent') discount = (subtotal * Number(cmp.discountValue)) / 100;
        }
      }

      const afterDiscount = Math.max(0, subtotal - discount);
      const vat = isInvoiced ? afterDiscount * 0.20 : 0;
      const grandTotal = afterDiscount + vat;
      let dep = 0;
      if (paymentStatus === 'Ödendi' || paymentStatus === 'Tamamlandı') dep = grandTotal;
      else if (hasDeposit || paymentStatus === 'Kapora Alındı') dep = Number(depositPaid) || 0;

      const remaining = Math.max(0, grandTotal - dep);
      const isFullyPaid = remaining === 0 || paymentStatus === 'Ödendi' || paymentStatus === 'Tamamlandı';

      return { venuePrice: vPrice, servicesTotal, serviceBreakdown, subtotal, discount, afterDiscount, vat, grandTotal, dep, remaining, isFullyPaid };
    };

    function DashboardPage({ venues = [], reservations = [], onNewResClick, onTabChange }) {
      const totalRevenue = reservations.reduce((acc, r) => acc + (Number(r.totalAmount) || 0), 0);
      const totalDeposit = reservations.reduce((acc, r) => acc + (Number(r.depositPaid) || 0), 0);
      const totalRemaining = reservations.reduce((acc, r) => acc + (Number(r.remainingBalance) || 0), 0);

      return (
        <div className="space-y-6 animate-fade-in max-w-7xl mx-auto">
          <div className="glass-panel p-6 rounded-3xl border border-slate-200 dark:border-brand-border flex justify-between items-center shadow-sm">
            <div>
              <h2 className="text-xl sm:text-2xl font-heading font-extrabold gold-gradient-text">İrem Düğün Sarayı Yönetim Paneli</h2>
              <p className="text-xs text-slate-500 dark:text-gray-400">Salon dolulukları, anlık rezervasyonlar ve finansal raporları tek bakışta izleyin.</p>
            </div>
            <button onClick={onNewResClick} className="gold-button font-bold text-xs px-4 py-2.5 rounded-xl shadow">✨ Hızlı Rezervasyon Gir</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="glass-panel p-5 rounded-3xl border border-slate-200 dark:border-brand-border"><div className="text-xs font-bold text-slate-500">Toplam Ciro</div><div className="text-xl font-extrabold font-mono">{formatCurrency(totalRevenue)}</div></div>
            <div className="glass-panel p-5 rounded-3xl border border-slate-200 dark:border-brand-border"><div className="text-xs font-bold text-slate-500">Kaporalar</div><div className="text-xl font-extrabold font-mono text-emerald-600">{formatCurrency(totalDeposit)}</div></div>
            <div className="glass-panel p-5 rounded-3xl border border-slate-200 dark:border-brand-border"><div className="text-xs font-bold text-slate-500">Net Kalan Alacak</div><div className="text-xl font-extrabold font-mono text-amber-600">{formatCurrency(totalRemaining)}</div></div>
          </div>
        </div>
      );
    }

    function CreateReservationPage({ venues = [], services = [], customers = [], campaigns = [], reservations = [], onSaveReservation, onCancel }) {
      const [venueId, setVenueId] = useState(venues[0]?.id || 'v1');
      const [customVenuePrice, setCustomVenuePrice] = useState(venues[0]?.price || 85000);
      const [guestCount, setGuestCount] = useState(500);
      const todayStr = new Date().toISOString().split('T')[0];
      const [startDate, setStartDate] = useState(todayStr);
      const [endDate, setEndDate] = useState(todayStr);
      const [startTime, setStartTime] = useState('18:00');
      const [endTime, setEndTime] = useState('23:00');
      const [selectedServices, setSelectedServices] = useState([]);
      const [campaignCode, setCampaignCode] = useState('');
      const [hasDeposit, setHasDeposit] = useState(true);
      const [depositPaid, setDepositPaid] = useState(15000);
      const [paymentStatus, setPaymentStatus] = useState('Kapora Alındı');
      const [customerMode, setCustomerMode] = useState('new');
      const [selectedCustomerId, setSelectedCustomerId] = useState(customers[0]?.id || '');
      const [newCustName, setNewCustName] = useState('');
      const [newCustPhone, setNewCustPhone] = useState('');
      const [referrerName, setReferrerName] = useState('');
      const [isInvoiced, setIsInvoiced] = useState(false);
      const [notes, setNotes] = useState('');
      const [flowPlan, setFlowPlan] = useState(DEFAULT_FLOW_PLAN);

      const selectedVenue = venues.find(v => v.id === venueId) || venues[0];
      const activeSlot = `${startTime} - ${endTime}`;

      const calculations = calculateReservationTotals({
        venuePrice: customVenuePrice, guestCount, selectedServices, allServices: services, campaignCode, campaigns, isInvoiced, hasDeposit, depositPaid, paymentStatus
      });

      const handleSubmit = () => {
        let custId = selectedCustomerId;
        let custName = newCustName || 'Müşteri';
        let custPhone = newCustPhone || '05000000000';
        let newCustObj = null;

        if (customerMode === 'new' && newCustName) {
          custId = 'c-' + Date.now();
          newCustObj = { id: custId, name: newCustName, phone: newCustPhone };
        }

        const newRes = {
          id: `RES-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`,
          venueId, customerId: custId, customerName: custName, customerPhone: custPhone, eventDate: startDate, startDate, endDate, startTime, endTime, timeSlot: activeSlot, guestCount, venuePrice: customVenuePrice, selectedServices, subtotal: calculations.subtotal, campaignCode, discountAmount: calculations.discount, vatAmount: calculations.vat, totalAmount: calculations.grandTotal, depositPaid: calculations.dep, remainingBalance: calculations.remaining, paymentStatus, notes, flowPlan
        };

        onSaveReservation(newRes, newCustObj);
      };

      useEffect(() => {
        if (window.updateMobileReservationSummary) {
          window.updateMobileReservationSummary({ remaining: calculations.remaining, isFullyPaid: calculations.isFullyPaid, calculations, isInvoiced, paymentStatus, hasDeposit, hasConflict: false, onSubmit: handleSubmit });
        }
      }, [calculations, isInvoiced, paymentStatus, hasDeposit]);

      return (
        <div className="space-y-6 max-w-7xl mx-auto pb-24 sm:pb-12 animate-fade-in">
          <div className="glass-panel p-4 sm:p-6 rounded-3xl border border-slate-200 dark:border-brand-border flex justify-between items-center">
            <div>
              <h1 className="font-heading font-extrabold text-xl sm:text-2xl gold-gradient-text">Hayalinizdeki Düğünü Birlikte Planlayalım!</h1>
              <p className="text-xs text-slate-500">Salon kiralama, hizmetler, fatura ve etkinlik akışını yönetin.</p>
            </div>
            <button onClick={onCancel} className="px-4 py-2 bg-slate-100 dark:bg-brand-card text-slate-700 dark:text-gray-300 rounded-xl text-xs font-bold">← Dön</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 space-y-6">
              
              {/* SECTION 1: DÜĞÜN SALONU SEÇİN */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">1. Düğün Salonu Seçin:</h3>
                <div className="flex overflow-x-auto gap-3.5 pb-2">
                  {venues.map(v => (
                    <div key={v.id} onClick={() => setVenueId(v.id)} className={`shrink-0 w-64 rounded-2xl border-2 p-3 cursor-pointer ${venueId === v.id ? 'border-amber-500 bg-amber-500/10' : 'border-slate-200 dark:border-brand-border bg-white dark:bg-brand-card'}`}>
                      <img src={v.image} className="w-full h-28 object-cover rounded-xl mb-2" />
                      <div className="font-bold text-xs text-slate-800 dark:text-gray-100">{v.name}</div>
                      <div className="text-xs font-extrabold text-amber-600">{formatCurrency(v.price)}</div>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-4 text-xs pt-2">
                  <div>
                    <label className="font-bold block mb-1">Etkinlik Başlangıç Tarihi:</label>
                    <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-slate-50 dark:bg-brand-dark border rounded-xl p-2.5 font-bold" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Davetli Sayısı (Kişi):</label>
                    <input type="number" value={guestCount} onChange={e => setGuestCount(Number(e.target.value))} className="w-full bg-slate-50 dark:bg-brand-dark border rounded-xl p-2.5 font-bold" />
                  </div>
                </div>

                {/* 14 GÜNLÜK MİNİK TAKVİM (RESTORED INSIDE SECTION 1) */}
                <div className="bg-slate-50 dark:bg-brand-dark border border-slate-200 dark:border-brand-border p-4 rounded-2xl space-y-2 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-slate-800 dark:text-gray-200">🗓️ Canlı Takvim & Çakışma Önizlemesi ({selectedVenue?.name}):</span>
                  </div>
                  <div className="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-slate-500">
                    <span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span>
                  </div>
                  <div className="grid grid-cols-7 gap-1 text-[11px]">
                    {[...Array(14)].map((_, i) => {
                      const dayDate = new Date(2026, 7, 20 + i);
                      const dateStr = dayDate.toISOString().split('T')[0];
                      const isSelectedDate = dateStr === startDate;
                      return (
                        <div key={dateStr} onClick={() => setStartDate(dateStr)} className={`p-2 rounded-xl text-center cursor-pointer border ${isSelectedDate ? 'gold-button shadow font-extrabold' : 'bg-white dark:bg-brand-card border-slate-200 dark:border-brand-border'}`}>
                          <span className="text-[9px]">{dayDate.getDate()} Ağu</span>
                          <span className="text-[9px] font-bold block">{isSelectedDate ? 'SEÇİLDİ' : 'BOŞ'}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* SECTION 2: EK HİZMETLER */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">2. Ek Hizmetler:</h3>
                <div className="space-y-2 text-xs">
                  {services.map(s => {
                    const isSelected = selectedServices.some(x => x.serviceId === s.id);
                    return (
                      <label key={s.id} className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer ${isSelected ? 'bg-amber-500/10 border-amber-500' : 'bg-slate-50 dark:bg-brand-dark border-slate-200'}`}>
                        <div className="flex items-center space-x-2">
                          <input type="checkbox" checked={isSelected} onChange={e => {
                            if (e.target.checked) setSelectedServices(prev => [...prev, { serviceId: s.id, quantity: 1 }]);
                            else setSelectedServices(prev => prev.filter(x => x.serviceId !== s.id));
                          }} className="w-4 h-4 accent-amber-600" />
                          <span className="font-bold text-slate-800 dark:text-gray-200">{s.name}</span>
                        </div>
                        <span className="font-mono font-bold text-amber-600">{formatCurrency(s.price)}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* SECTION 3: ÖDEME & KAPORA */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">3. Ödeme, Kapora & İndirim Kodu Bilgileri</h3>
                <div className="grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Kapora Ödendi Mi?</label>
                    <select value={hasDeposit ? 'yes' : 'no'} onChange={e => setHasDeposit(e.target.value === 'yes')} className="w-full bg-slate-50 dark:bg-brand-dark border p-2.5 rounded-xl font-bold">
                      <option value="yes">Evet, Kapora Alındı</option>
                      <option value="no">Hayır, Ödenmedi</option>
                    </select>
                  </div>
                  {hasDeposit && (
                    <div>
                      <label className="font-bold block mb-1">Ödenen Kapora (TL):</label>
                      <input type="number" value={depositPaid} onChange={e => setDepositPaid(Number(e.target.value))} className="w-full bg-slate-50 dark:bg-brand-dark border p-2.5 rounded-xl font-bold text-emerald-600" />
                    </div>
                  )}
                </div>
              </div>

              {/* SECTION 4: MÜŞTERİ BİLGİLERİ */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">4. Müşteri İletişim Bilgileri:</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Adı Soyadı / Firma:</label>
                    <input type="text" value={newCustName} onChange={e => setNewCustName(e.target.value)} placeholder="Mehmet Yılmaz" className="w-full bg-slate-50 dark:bg-brand-dark border p-2.5 rounded-xl font-bold" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Telefon Numarası:</label>
                    <input type="text" value={newCustPhone} onChange={e => setNewCustPhone(formatPhoneNumber(e.target.value))} placeholder="0 (5XX) XXX XX XX" className="w-full bg-slate-50 dark:bg-brand-dark border p-2.5 rounded-xl font-bold" />
                  </div>
                </div>
              </div>

              {/* SECTION 5: FATURA */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">5. Fatura Bilgileri</h3>
                <label className="flex items-center space-x-2 text-xs font-bold cursor-pointer">
                  <input type="checkbox" checked={isInvoiced} onChange={e => setIsInvoiced(e.target.checked)} className="w-4 h-4 accent-amber-600" />
                  <span>Faturalı İşlem (%20 KDV Hesapla)</span>
                </label>
              </div>

              {/* SECTION 6: AKIŞ PLANLAMASI */}
              <div className="glass-panel p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-brand-border">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100">6. Organizasyon & Etkinlik Akış Planlaması</h3>
                <div className="space-y-2 text-xs">
                  {flowPlan.map((item, idx) => (
                    <div key={idx} className="flex items-center space-x-2 p-2 bg-slate-50 dark:bg-brand-dark rounded-xl border">
                      <input type="text" value={item.time} onChange={e => { const val = e.target.value; setFlowPlan(prev => prev.map((x, i) => i === idx ? { ...x, time: val } : x)); }} className="w-20 bg-white dark:bg-brand-card border p-1 rounded font-mono font-bold text-center" />
                      <input type="text" value={item.title} onChange={e => { const val = e.target.value; setFlowPlan(prev => prev.map((x, i) => i === idx ? { ...x, title: val } : x)); }} className="flex-1 bg-white dark:bg-brand-card border p-1 rounded font-bold" />
                    </div>
                  ))}
                </div>
              </div>

              {/* SECTION 7: EK NOTLAR */}
              <div className="glass-panel p-6 rounded-3xl space-y-3 border border-slate-200 dark:border-brand-border text-xs">
                <h3 className="font-heading font-bold text-base sm:text-lg text-slate-800 dark:text-gray-100 border-b pb-2">7. Operasyonel Ek Notlar & Özel İstekler:</h3>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Gelin odası ikramları, çiçek renk tercihleri..." className="w-full bg-slate-50 dark:bg-brand-dark border rounded-xl p-3 h-20" />
              </div>

            </div>

            {/* DESKTOP RIGHT SUMMARY */}
            <div className="hidden sm:block lg:col-span-4 space-y-6">
              <div className="glass-panel p-6 rounded-3xl space-y-4 border-2 border-slate-200 dark:border-brand-border sticky top-24">
                <h3 className="font-heading font-extrabold text-base border-b pb-3">📜 Canlı Hesaplama Kartı</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between font-bold"><span>Salon Kiralama:</span><span className="font-mono">{formatCurrency(calculations.venuePrice)}</span></div>
                  <div className="flex justify-between font-extrabold text-base border-t pt-2"><span>Genel Toplam:</span><span className="font-mono text-amber-600">{formatCurrency(calculations.grandTotal)}</span></div>
                  <div className={`flex justify-between font-bold text-sm p-2.5 rounded-xl border mt-2 ${calculations.isFullyPaid ? 'bg-emerald-500/10 text-emerald-600' : 'bg-red-500/10 text-red-600'}`}>
                    <span>Kalan Net Bakiye:</span>
                    <span className="font-mono font-extrabold">{calculations.isFullyPaid ? '₺0 (Ödendi ✓)' : formatCurrency(calculations.remaining)}</span>
                  </div>
                </div>
                <button onClick={handleSubmit} className="w-full gold-button font-bold py-3.5 rounded-2xl text-xs shadow-xl">🎉 Rezervasyonu Kaydet</button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('create-reservation');
      const [activeRole, setActiveRole] = useState('SuperAdmin');
      const [currentTheme, setCurrentTheme] = useState('obsidian-gold');
      const [venues, setVenues] = useState(INITIAL_VENUES);
      const [services, setServices] = useState(INITIAL_SERVICES);
      const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);
      const [reservations, setReservations] = useState(INITIAL_RESERVATIONS);
      const [campaigns, setCampaigns] = useState(INITIAL_CAMPAIGNS);
      const [users, setUsers] = useState(INITIAL_USERS);
      const [alertModal, setAlertModal] = useState({ isOpen: false, title: '', message: '' });

      const showAlert = (title, message) => { setAlertModal({ isOpen: true, title, message }); };

      const handleSaveReservation = (newRes, newCustObj) => {
        if (newCustObj) setCustomers(prev => [newCustObj, ...prev]);
        setReservations(prev => [newRes, ...prev]);
        showAlert('🎉 REZERVASYON VE SÖZLEŞME OLUŞTURULDU!', `${newRes.customerName} için ${newRes.id} sözleşme koduyla rezervasyon kaydedildi.`);
        setActiveTab('reservations');
      };

      return (
        <div className="flex h-screen bg-slate-900 dark:bg-brand-dark text-slate-100 font-sans overflow-hidden">
          <NotificationPopup alertModal={alertModal} onClose={() => setAlertModal({ isOpen: false, title: '', message: '' })} />
          <SidebarComponent activeTab={activeTab} onTabChange={setActiveTab} activeRole={activeRole} onRoleChange={setActiveRole} />
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-100 dark:bg-brand-dark text-slate-800 dark:text-gray-200">
            <HeaderComponent activeTab={activeTab} onTabChange={setActiveTab} activeRole={activeRole} currentUser={users[0]} />
            <main className="flex-1 overflow-y-auto p-4 sm:p-6">
              {activeTab === 'dashboard' && <DashboardPage venues={venues} reservations={reservations} onNewResClick={() => setActiveTab('create-reservation')} onTabChange={setActiveTab} />}
              {activeTab === 'create-reservation' && <CreateReservationPage venues={venues} services={services} customers={customers} campaigns={campaigns} reservations={reservations} onSaveReservation={handleSaveReservation} onCancel={() => setActiveTab('reservations')} />}
              {activeTab === 'reservations' && (
                <div className="glass-panel p-6 rounded-3xl border text-xs space-y-4">
                  <h2 className="text-xl font-bold">📅 Rezervasyon Listesi ({reservations.length} Adet)</h2>
                  <div className="space-y-2">
                    {reservations.map(r => (
                      <div key={r.id} className="p-3 bg-slate-50 dark:bg-brand-dark rounded-xl border flex justify-between">
                        <span className="font-bold">{r.id} - {r.customerName}</span>
                        <span className="font-mono text-amber-600 font-extrabold">{formatCurrency(r.totalAmount)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>
          <MobileBottomSummaryBar />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
