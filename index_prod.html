    <!-- INSTANT THEME RESTORE SCRIPT (READS DIRECTLY FROM SERVER INJECTED DOM ATTRIBUTE) -->
  <script>
    (function() {
      try {
        var domTheme = document.documentElement.getAttribute('data-ui-theme');
        if (domTheme) return; // Server already injected active theme into HTML!
        var getVal = function(k) {
          try {
            var v = localStorage.getItem(k);
            if (!v) return null;
            if (v.startsWith('"') || v.startsWith('{') || v.startsWith('[')) return JSON.parse(v);
            return v;
          } catch(e) { return localStorage.getItem(k); }
        };
        var theme = getVal('irem_cache_theme_color') || getVal('selected_theme');
        if (theme) {
          document.documentElement.setAttribute('data-ui-theme', theme);
        }
      } catch(e) {}
    })();
  </script>

  <!-- THEME DIAGNOSTIC CONSOLE TOOL: Type checkTheme() in browser F12 console -->
  <script>
    window.checkTheme = function() {
      console.log('🔍 SYSTEM THEME DIAGNOSTIC REPORT:');
      console.log('----------------------------------------');
      var domTheme = document.documentElement.getAttribute('data-ui-theme') || 'classic_gold (default)';
      var localTheme = localStorage.getItem('irem_cache_theme_color') || localStorage.getItem('selected_theme') || 'None';
      console.log('1. HTML DOM Attribute (data-ui-theme):', domTheme);
      console.log('2. LocalStorage Cache:', localTheme);
      
      fetch('/api/system-settings')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('3. Server Backend DB Theme (/api/system-settings):', data.themeColor || 'Unknown');
          console.log('----------------------------------------');
          if (data.themeColor === domTheme || (domTheme === 'classic_gold (default)' && data.themeColor === 'gold')) {
            console.log('✅ RESULT: THEME IS 100% MATCHED AND PERSISTENT IN BACKEND DB!');
          } else {
            console.warn('⚠️ WARNING: DOM theme (' + domTheme + ') does not match Backend DB theme (' + data.themeColor + ').');
          }
        }).catch(function(err) { console.error('❌ Failed to fetch backend DB theme:', err); });
    };
  </script>

    ::-webkit-scrollbar-track { background: var(--color-bg); }
    ::-webkit-scrollbar-thumb { background: var(--color-card-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-gold); }

    /* PREVENT BLANK CANVAS DURING HARD SCROLLING */
    main {
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }

    /* FAST & BUTTERY SMOOTH SLIDE-IN FROM LEFT ANIMATION (APPLE CUBIC-BEZIER) */
    @keyframes slideInLeft {
      0% {
        transform: translateX(-100%);
        opacity: 0.7;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .animate-slide-in-left {
      animation: slideInLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform;
    }

    /* SYSTEM-WIDE PERFORMANCE LAYER 1: SKELETON SHIMMER ANIMATION */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(226, 232, 240, 0.5) 25%, rgba(203, 213, 225, 0.9) 50%, rgba(226, 232, 240, 0.5) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    .dark .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.5) 25%, rgba(51, 65, 85, 0.9) 50%, rgba(30, 41, 59, 0.5) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
  </style>
